<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RimWorld Advanced Taming & Colony Utility Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070b14; color: #cbd5e1; }
        .rim-font { font-family: 'Cinzel', serif; }
        .rim-card { background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.75) 100%); backdrop-filter: blur(16px); border: 1px solid rgba(245, 158, 11, 0.2); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
        .rim-glow { box-shadow: 0 0 20px rgba(245, 158, 11, 0.15); }
        select option { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <!-- Header -->
    <header class="bg-slate-950/90 border-b border-amber-500/30 sticky top-0 z-50 backdrop-blur-md shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-amber-500 to-amber-700 text-slate-950 font-black px-3.5 py-2 rounded-xl text-xl tracking-wider shadow-lg shadow-amber-500/20 rim-font">RW</div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white rim-font flex items-center gap-2">
                        RIMWORLD <span class="text-amber-400">TAMING & UTILITY INTEL</span>
                    </h1>
                    <p class="text-xs text-slate-400">Vanilla & All Expansions (Royalty, Ideology, Biotech, Anomaly)</p>
                </div>
            </div>
            <div class="flex items-center gap-2 text-xs bg-slate-900 px-3.5 py-2 rounded-xl border border-amber-500/30 text-amber-400 font-mono shadow-inner">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Colony Simulation Engine v1.6 Active</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow space-y-8 w-full">

        <!-- Input Control Panel -->
        <section class="rim-card rounded-2xl p-6 sm:p-8 rim-glow">
            <h2 class="text-sm uppercase tracking-wider font-bold text-amber-400 mb-6 rim-font flex items-center gap-2">
                <i class="fa-solid fa-sliders text-amber-500"></i> Simulation Parameters
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Creature Select -->
                <div>
                    <label class="block text-xs uppercase tracking-wider font-semibold text-slate-400 mb-2">Select Creature (Vanilla + DLCs)</label>
                    <select id="creature-select" class="w-full bg-slate-900 border border-slate-700 hover:border-amber-500/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 transition-colors shadow-inner">
                        <!-- Populated dynamically via JS -->
                    </select>
                </div>
                <!-- Pawn Animal Skill -->
                <div>
                    <label class="block text-xs uppercase tracking-wider font-semibold text-slate-400 mb-2">Tamer's Animals Skill (Level 0 - 20)</label>
                    <input type="number" id="pawn-skill" min="0" max="20" value="8" class="w-full bg-slate-900 border border-slate-700 hover:border-amber-500/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 transition-colors shadow-inner font-mono">
                </div>
                <!-- Pawn Passion -->
                <div>
                    <label class="block text-xs uppercase tracking-wider font-semibold text-slate-400 mb-2">Pawn's Animal Passion</label>
                    <select id="pawn-passion" class="w-full bg-slate-900 border border-slate-700 hover:border-amber-500/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 transition-colors shadow-inner">
                        <option value="0">None (No Flame)</option>
                        <option value="1" selected>Minor Passion (Single Flame)</option>
                        <option value="2">Major Passion (Double Flame)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Dynamic Results Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Column 1: Specimen Visual Profile -->
            <div class="rim-card rounded-2xl p-6 flex flex-col justify-between text-center shadow-xl">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">Specimen Profile</span>
                        <span id="creature-dlc-tag" class="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[10px] px-2.5 py-1 rounded-lg font-mono uppercase tracking-wider">Vanilla</span>
                    </div>
                    <h3 id="creature-name" class="text-2xl font-bold text-white rim-font mb-6">Muffalo</h3>
                    
                    <!-- Stylized Graphic Container -->
                    <div class="w-full h-48 bg-gradient-to-b from-slate-900/90 to-slate-950 rounded-xl border border-slate-800 flex flex-col items-center justify-center relative overflow-hidden shadow-inner mb-6 group">
                        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(245,158,11,0.08)_0%,transparent_70%)]"></div>
                        <div class="w-20 h-20 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform duration
